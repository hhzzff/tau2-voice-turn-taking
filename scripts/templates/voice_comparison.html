<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>全双工语音对比 · 对话与评审</title>
<style>
:root{color-scheme:light;--bg:#f5f8fc;--paper:#fff;--ink:#162b49;--muted:#597085;--line:#dbe4ef;--blue:#245ac8;--teal:#087e78;--amber:#946000;--rose:#b13d59;--user:#eaf2ff;--assistant:#edf7f5;--third:#fff4d9;font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #6a9beb;outline-offset:3px}a{color:var(--blue);text-underline-offset:3px}main{max-width:1440px;margin:auto;padding:36px 34px 64px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:28px}h1{font-family:Bahnschrift,"Microsoft YaHei",sans-serif;font-size:clamp(30px,4vw,46px);line-height:1.25;font-weight:600;letter-spacing:-.035em;margin:0 0 12px}.intro{max-width:780px;margin:0;color:var(--muted)}.batch{flex-shrink:0;color:var(--muted);font-size:13px}.summary{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 26px}.summary h2{font-size:18px;margin:0 0 4px}.hint{color:var(--muted);font-size:13px;margin:5px 0 12px}.table-wrap{overflow:auto}table{border-collapse:collapse;min-width:640px;width:100%;font-size:14px}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}th:first-child,td:first-child{padding-left:0}tbody tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;white-space:nowrap;font-size:12px;font-weight:600}.pass{color:#176047;background:#e8f5ee}.fail{color:#9d2d48;background:#ffedf1}.inconclusive,.not_evaluated{color:#805c04;background:#fff5d8}.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:8;padding:16px 0 12px;background:var(--bg);overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);padding:12px 22px}.tab.active{color:white;background:var(--ink);border-color:var(--ink)}.tab small{margin-left:12px;opacity:.8}.player-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}.player-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 6px}.player-head h2{font-size:23px;margin:0}.model-detail{font-size:13px;color:var(--muted);margin:3px 0}.links{display:flex;gap:14px;font-size:13px}.playback{padding:0 24px 18px}audio{display:block;width:100%;height:42px;margin:10px 0}.play-settings{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}output,time,.jump{font-variant-numeric:tabular-nums}output{color:var(--ink)}select,input[type=search]{background:white;color:var(--ink);border:1px solid #c7d5e4;border-radius:6px;padding:5px 8px}.play-settings select{padding:2px 6px}.timeline{padding:0 24px 20px}.axis{display:flex;justify-content:space-between;margin:0 0 3px 78px;font-size:11px;color:var(--muted)}.lane{display:grid;grid-template-columns:66px 1fr;align-items:center;gap:12px;margin:7px 0;font-size:12px}.track{position:relative;height:25px;background:#eef3f8;border-radius:4px;overflow:hidden}.seg{position:absolute;border:0;min-width:3px;top:4px;height:17px;border-radius:3px;opacity:.85;padding:0}.seg:hover{opacity:1;outline:2px solid var(--ink);z-index:2}.seg.user{background:var(--blue)}.seg.assistant{background:var(--teal)}.seg.third_party{background:#cc910f}.seg.eventseg{top:2px;height:21px;background:#c75b73;color:white;font-size:11px}.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none;z-index:3}.seek{width:calc(100% - 78px);margin:5px 0 0 78px;accent-color:var(--blue)}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,1fr);gap:22px;align-items:start;margin-top:22px}.dialogue,.evidence{background:white;border:1px solid var(--line);border-radius:14px;min-width:0}.section-head{padding:20px 24px 12px;border-bottom:1px solid var(--line)}.section-head h2{font-size:19px;margin:0 0 4px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters input[type=search]{min-width:130px;width:100%;flex:1}.filters select{max-width:100%;font-size:13px}.follow{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin:10px 0 0}.follow input{accent-color:var(--blue)}.transcripts{padding:6px 24px 24px}.turn{position:relative;padding:18px 0 17px 15px;border-bottom:1px solid #e8edf4;border-left:3px solid transparent;scroll-margin-top:100px}.turn:last-child{border-bottom:0}.turn.active{border-left-color:var(--blue);background:#f2f6fd}.turn-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:7px}.role{padding:2px 8px;border-radius:4px;font-weight:600}.role.user{color:var(--blue);background:var(--user)}.role.assistant{color:var(--teal);background:var(--assistant)}.role.third_party{color:var(--amber);background:var(--third)}.jump{border:0;background:none;color:var(--blue);padding:0;text-align:left;font-size:12px}.jump:hover{text-decoration:underline}.turn p{font-family:Georgia,"Microsoft YaHei",serif;font-size:17px;line-height:1.75;margin:0;max-width:72ch;white-space:pre-wrap;overflow-wrap:anywhere}.overlap{color:#99516a;font-size:11px}.event-tag{font-size:11px;color:var(--rose);background:#fff0f3;border:0;border-radius:4px;padding:2px 6px}.source{font-size:11px;color:var(--muted)}.event-list{padding:0 20px 15px}.event{padding:18px 0;border-bottom:1px solid var(--line);scroll-margin-top:100px}.event:last-child{border-bottom:0}.event.active .event-head{color:var(--blue)}.event-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.event h3{font-size:15px;margin:0}.event .time-row{display:flex;gap:10px;align-items:center;margin:6px 0 10px}.event blockquote{margin:10px 0;padding:10px 13px;background:#f5f8fc;border-left:3px solid #bbcee8;font-family:Georgia,serif;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.event p{font-size:13px;line-height:1.8;margin:8px 0;overflow-wrap:anywhere}.event details{font-size:12px;margin-top:10px}.event summary{cursor:pointer;color:var(--muted)}.raw{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:#f4f7fa;padding:12px;color:var(--muted);font:12px/1.7 "Segoe UI",sans-serif}.evidence .hint{margin:6px 0}.asr-quote{border-left-color:#a9cfca!important;background:#f0f8f6!important;font-size:14px!important}.empty{padding:20px 0;color:var(--muted)}.conditions{margin-top:25px;padding:8px 2px;color:var(--muted);font-size:13px;max-width:95ch}.conditions summary{cursor:pointer;color:var(--ink);font-weight:600}.conditions p{margin:8px 0}.error{color:#9d2d48}mark{background:#fff0b9;color:inherit}.status{font-size:12px;color:var(--muted)}
.review-note{padding:10px 12px;background:#fff5df;color:#79500c;border-radius:6px}.review-flag{display:block;font-size:11px;color:#946000;margin-top:3px}
@media(min-width:1100px){.evidence{position:sticky;top:83px;max-height:calc(100vh - 105px);overflow:auto}}
@media(max-width:850px){main{padding:22px 16px 40px}.hero{display:block}.batch{margin-top:12px}.summary{padding:17px}.workspace{grid-template-columns:1fr}.player-head{align-items:start}.links{flex-wrap:wrap;gap:7px}.tab{padding:10px 15px}.tab small{display:none}.section-head,.player-head{padding-left:17px;padding-right:17px}.transcripts{padding-left:14px;padding-right:17px}.playback,.timeline{padding-left:17px;padding-right:17px}.turn p{font-size:16px}.intro{font-size:14px}.player-head h2{font-size:21px}.axis{margin-left:65px}.lane{grid-template-columns:55px 1fr;gap:10px}.seek{width:calc(100% - 65px);margin-left:65px}.turn{padding-left:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header class="hero"><div><h1>听见什么，何时回应</h1><p class="intro">三种语音模型，同一场野餐计划。沿着对话查看追问、否定、背景插话与停顿，结合原始录音判断每一次回应。</p></div><div class="batch" id="batch"></div></header>
<section class="summary"><h2>三模型对照</h2><p class="hint" id="judge-label">每个事件综合回答内容、时机与音频证据，给出一个评审结论。</p><div class="table-wrap" id="overview"></div></section>
<nav id="tabs" class="tabs" aria-label="切换被测模型" role="tablist"></nav>
<div id="sample" role="tabpanel"></div>
<details class="conditions"><summary>实验条件与证据来源</summary><div id="conditions"></div><p>音轨文本来自实际交付片段的标签；时间定位到片段起点，不是逐词对齐。ASR 视图保留每段最后一次识别的已播放音频前缀，可能缺少此后的尾句。重叠标记表示声道时间区间相交，是否构成有效打断需结合上下文听辨。</p></details>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const eventNames={'interruption.follow_up':'追问打断','interruption.denial':'否定打断','rejection.third_party':'第三方插话','turn_taking.handoff':'跨轮记忆','proactive.backchannel':'长段附和','rejection.pause':'句内停顿','proactive.completion':'CTC 补全','rejection.contextual':'上下文插话','rejection.noise':'背景噪声'};
const roleNames={user:'用户',assistant:'助手',third_party:'第三方'},verdictNames={pass:'通过',fail:'未通过',inconclusive:'证据不足',not_evaluated:'未评审'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=s=>{s=Math.max(0,Number(s)||0);return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`};
const badge=v=>`<span class="badge ${['pass','fail','inconclusive','not_evaluated'].includes(v)?v:'not_evaluated'}">${esc(verdictNames[v]||'未评审')}</span>`;
let currentIndex=0,transcriptRows=[],lastFollow=-1;
const eventIds=[...new Set(D.samples.flatMap(s=>s.events.map(e=>e.event_id)))];
const counts=s=>{const c={pass:0,fail:0,inconclusive:0,not_evaluated:0};s.events.forEach(e=>c[e.verdict in c?e.verdict:'not_evaluated']++);return c};
function pauseSummary(s){const e=s.events.find(e=>e.event_id==='rejection.pause'),p=e?.pause_audio_evidence;return `${Math.round((s.pause_seconds||0)*1000)} ms / ${p?.status==='measured'?Math.round(p.duration_seconds*1000)+' ms':'待核对'}`}
document.getElementById('batch').textContent=`${D.samples.length} 组新录音 / ${eventIds.length} 类事件`;
const judges=[...new Set(D.samples.flatMap(s=>s.judge_models||[]))];
if(judges.length)document.getElementById('judge-label').textContent+=` 评审模型：${judges.join('、')}。`;
document.getElementById('overview').innerHTML=D.samples.length?`<table><thead><tr><th>事件</th>${D.samples.map(s=>`<th scope="col">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${eventIds.map((id,k)=>`<tr><td>${esc(eventNames[id]||id)}</td>${D.samples.map((s,i)=>`<td><button class="jump" aria-label="查看 ${esc(s.name+' '+(eventNames[id]||id))}" onclick="openEvent(${i},${k})">${badge(s.events.find(e=>e.event_id===id)?.verdict)}</button></td>`).join('')}</tr>`).join('')}<tr><td>通过 / 未通过 / 证据不足</td>${D.samples.map(s=>{const c=counts(s);return `<td>${c.pass} / ${c.fail} / ${c.inconclusive}${c.not_evaluated?' / '+c.not_evaluated+' 未评审':''}</td>`}).join('')}</tr><tr><td>停顿请求 / 波形实测</td>${D.samples.map(s=>`<td>${esc(pauseSummary(s))}</td>`).join('')}</tr></tbody></table>`:'<p class="empty">录音或评审尚未完成。</p>';
document.getElementById('conditions').innerHTML=(D.manifest.notes||[]).map(n=>`<p>${esc(n)}</p>`).join('')+(D.manifest.failures||[]).map(f=>`<p class="error">${esc(f.name)}：${esc(f.error)}。保留部分证据，未完成项不计为模型失败。</p>`).join('');
function jump(t,scroll=false){const p=document.getElementById('player');if(!p)return;p.currentTime=Math.max(0,Number(t)||0);p.play().catch(()=>{});updatePlayback();if(scroll)p.scrollIntoView({block:'center',behavior:'smooth'})}
function openEvent(i,k){show(i);const id=eventIds[k],e=D.samples[i].events.find(e=>e.event_id===id);if(!e)return;jump(e.start_seconds);document.getElementById('event-'+D.samples[i].events.indexOf(e))?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function heardBefore(s,e){return (s.asr||[]).filter(a=>a.decision_seconds<=e.start_seconds+.001&&a.audio_end_seconds<=e.start_seconds+.001&&!a.error).sort((a,b)=>b.audio_end_seconds-a.audio_end_seconds||b.decision_seconds-a.decision_seconds)[0]}
function show(i){document.querySelectorAll('audio').forEach(a=>a.pause());currentIndex=i;lastFollow=-1;const s=D.samples[i];document.getElementById('tabs').innerHTML=D.samples.map((x,j)=>`<button class="tab ${i===j?'active':''}" role="tab" aria-selected="${i===j}" onclick="show(${j})">${esc(x.name)}<small>${time(x.duration)}</small></button>`).join('');if(!s){document.getElementById('sample').innerHTML='<p class="empty">暂无完整录音。</p>';return}
const dur=Math.max(1,Number(s.duration)||1),segments=role=>s.labels.filter(l=>l.role===role).map(l=>`<button class="seg ${role}" style="left:${l.start/dur*100}%;width:${Math.max(.25,(l.end-l.start)/dur*100)}%" title="${esc(time(l.start)+' '+l.text)}" aria-label="播放${roleNames[role]} ${time(l.start)}" onclick="jump(${l.start})"></button>`).join('');
const eventSegments=s.events.filter(e=>e.start_seconds!=null).map(e=>`<button class="seg eventseg" style="left:${e.start_seconds/dur*100}%;width:${Math.max(.9,(e.end_seconds-e.start_seconds)/dur*100)}%" title="${esc(eventNames[e.event_id]||e.event_id)}" aria-label="播放${esc(eventNames[e.event_id]||e.event_id)}" onclick="jump(${e.start_seconds})">${s.events.indexOf(e)+1}</button>`).join('');
document.getElementById('sample').innerHTML=`<section class="player-panel"><div class="player-head"><div><h2>${esc(s.name)}</h2><p class="model-detail">${esc(s.description||'')} / ${time(dur)}</p></div><div class="links"><a href="${esc(s.directory)}/audio/both.wav" download>下载录音</a><a href="${esc(s.directory)}/assessment.json">评审记录</a></div></div><div class="playback"><audio id="player" controls preload="metadata" src="${esc(s.directory)}/audio/both.wav"></audio><div class="play-settings"><output id="clock">00:00.0 / ${time(dur)}</output><label>播放速度 <select id="speed" aria-label="播放速度"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select> 倍</label><span id="audio-status" class="status">用户在左声道，助手在右声道</span></div></div><div class="timeline"><div class="axis">${[0,.25,.5,.75,1].map(f=>`<span>${time(dur*f)}</span>`).join('')}</div>${['user','third_party','assistant'].map(role=>`<div class="lane"><span>${roleNames[role]}</span><div class="track">${segments(role)}<i class="cursor"></i></div></div>`).join('')}<div class="lane"><span>事件</span><div class="track">${eventSegments}<i class="cursor"></i></div></div><input id="seek" class="seek" type="range" min="0" max="${dur}" step=".1" value="0" aria-label="音频时间线跳转"></div></section>
<div class="workspace"><section class="dialogue"><div class="section-head"><h2>对话 transcript</h2><p class="hint" id="source-note">按音轨片段整理，点击时间播放；重叠发言分别保留。</p><div class="filters"><input id="search" type="search" placeholder="搜索对话内容" aria-label="搜索对话内容"><select id="role-filter" aria-label="筛选说话人"><option value="all">全部说话人</option><option value="user">用户</option><option value="assistant">助手</option><option value="third_party">第三方</option></select><select id="source-filter" aria-label="转录来源"><option value="labels">音轨文本</option><option value="asr">已播放音频 ASR</option></select></div><label class="follow"><input id="follow" type="checkbox">随播放滚动到当前发言</label></div><div class="transcripts" id="transcripts"></div></section>
<aside class="evidence"><div class="section-head"><h2>事件与综合评审</h2><p class="hint">点击时间听上下文，展开可核查触发依据。</p></div><div class="event-list">${s.events.map((e,k)=>{const stim=e.stimulus||{},pause=Number(stim.pause_seconds||e.pause_seconds||0),p=e.pause_audio_evidence,heard=heardBefore(s,e);return `<article class="event" id="event-${k}" data-start="${e.start_seconds??-1}" data-end="${e.end_seconds??-1}"><div class="event-head"><h3>${k+1}. ${esc(eventNames[e.event_id]||e.event_id)}</h3>${badge(e.verdict)}</div><div class="time-row">${e.start_seconds!=null?`<button class="jump" onclick="jump(${Math.max(0,e.start_seconds-3)})">${time(e.start_seconds)} · 听前 3 秒</button>`:'<span class="status">未触发</span>'}</div><blockquote>${esc(stim.text||'未产生刺激')}${pause?`\n〔停顿 ${Math.round(pause*1000)} ms〕`:''}${stim.continuation?'\n'+esc(stim.continuation):''}</blockquote><p>${esc(e.reason||e.event_judgment?.reason||'尚无综合评审。')}</p>${p?.status==='measured'?`<p class="hint"><button class="jump" onclick="jump(${Number(p.absolute_start_seconds??e.start_seconds+p.start_seconds)})">跳到停顿</button> · 实测 ${Math.round(p.duration_seconds*1000)} ms</p>`:''}<details><summary>为什么在这里触发</summary><p>${esc(stim.reason||'未记录')}</p>${heard?`<p class="hint">触发前最近一次 ASR（识别至 ${time(heard.audio_end_seconds)}）</p><blockquote class="asr-quote">${esc(heard.transcript)}</blockquote>`:''}</details><details><summary>完整评审证据</summary><pre class="raw">${esc(JSON.stringify(e,null,2))}</pre></details></article>`}).join('')}</div></aside></div>`;
const p=document.getElementById('player');p.addEventListener('timeupdate',updatePlayback);p.addEventListener('seeked',updatePlayback);p.addEventListener('error',()=>document.getElementById('audio-status').textContent='音频加载失败，请确认 HTML 与模型音频目录一起保留。');document.getElementById('speed').onchange=e=>p.playbackRate=Number(e.target.value);document.getElementById('seek').oninput=e=>jump(e.target.value);['search','role-filter','source-filter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',renderTranscript));renderTranscript();annotateReviews()}
function readableRows(rows){const result=[];rows.forEach(row=>{const last=result[result.length-1];if(last&&last.role===row.role&&last.source===row.source&&row.start>=last.end-.001&&row.start-last.end<=.25){last.end=row.end;last.text+=/^[,.;:!?')]/.test(row.text)?row.text:' '+row.text}else result.push({...row})});return result}
function renderTranscript(){const s=D.samples[currentIndex],source=document.getElementById('source-filter').value,role=document.getElementById('role-filter').value,q=document.getElementById('search').value.toLowerCase().trim();let rows=s.labels.map(l=>({...l,source:'音轨文本'}));if(source==='asr'){const latest=new Map();(s.asr||[]).forEach(a=>{if(!a.error&&a.transcript){const key=a.segment_id??a.audio_file;const old=latest.get(key);if(!old||a.decision_seconds>=old.decision_seconds)latest.set(key,a)}});rows=rows.filter(l=>l.role!=='assistant').concat([...latest.values()].map(a=>({start:a.audio_start_seconds,end:a.audio_end_seconds,text:a.transcript,role:'assistant',source:'已播放 ASR'}))).sort((a,b)=>a.start-b.start);document.getElementById('source-note').textContent='助手使用每段最后一次已播放音频识别；可能缺少后续尾句。用户保留音轨文本。'}else document.getElementById('source-note').textContent='按音轨片段整理，相邻短片段合并展示；时间不是逐词对齐。可切换 ASR 核查，重叠发言分别保留。';rows=readableRows(rows);
transcriptRows=rows.filter(l=>(role==='all'||l.role===role)&&(!q||l.text.toLowerCase().includes(q)));document.getElementById('transcripts').innerHTML=transcriptRows.map((l,k)=>{const overlap=rows.some(r=>r.role!==l.role&&Math.min(r.end,l.end)-Math.max(r.start,l.start)>.15),events=s.events.filter(e=>e.start_seconds!=null&&e.start_seconds>=l.start-.21&&e.start_seconds<l.end);return `<article class="turn" id="turn-${k}" data-start="${l.start}" data-end="${l.end}"><div class="turn-head"><span class="role ${l.role}">${roleNames[l.role]||esc(l.role)}</span><button class="jump" aria-label="播放 ${roleNames[l.role]} ${time(l.start)}" onclick="jump(${l.start})">${time(l.start)}–${time(l.end)}</button>${overlap?'<span class="overlap">重叠发言</span>':''}${events.map(e=>`<button class="event-tag" onclick="jump(${e.start_seconds});document.getElementById('event-${s.events.indexOf(e)}').scrollIntoView({block:'nearest'})">${esc(eventNames[e.event_id]||e.event_id)}</button>`).join('')}<span class="source">${l.source}</span></div><p>${esc(l.text)}</p></article>`}).join('')||'<p class="empty">没有匹配的对话片段。</p>';lastFollow=-1;updatePlayback()}
function updatePlayback(){const p=document.getElementById('player');if(!p)return;const s=D.samples[currentIndex],t=p.currentTime;document.getElementById('clock').textContent=`${time(t)} / ${time(s.duration)}`;document.getElementById('seek').value=t;document.querySelectorAll('.cursor').forEach(c=>c.style.left=`${t/Math.max(1,s.duration)*100}%`);let active=-1;document.querySelectorAll('.turn').forEach((el,k)=>{const on=t>=Number(el.dataset.start)&&t<Number(el.dataset.end);el.classList.toggle('active',on);if(on)active=k});document.querySelectorAll('.event').forEach(el=>el.classList.toggle('active',Number(el.dataset.start)>=0&&t>=Number(el.dataset.start)&&t<Number(el.dataset.end)));if(active>=0&&active!==lastFollow&&document.getElementById('follow').checked){document.getElementById('turn-'+active)?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});lastFollow=active}}
function annotateReviews(){const s=D.samples[currentIndex];if(!s)return;Object.entries(s.review_notes||{}).forEach(([id,note])=>{const k=s.events.findIndex(e=>e.event_id===id),el=document.getElementById('event-'+k);if(el&&!el.querySelector('.review-note')){const p=document.createElement('p');p.className='review-note';p.textContent='待复核：'+note;el.querySelector('blockquote')?.after(p)}});D.samples.forEach((sample,i)=>Object.entries(sample.review_notes||{}).forEach(([id,note])=>{const row=document.querySelectorAll('#overview tbody tr')[eventIds.indexOf(id)],cell=row?.querySelectorAll('td')[i+1];if(cell&&!cell.querySelector('.review-flag')){const flag=document.createElement('span');flag.className='review-flag';flag.textContent='待复核';flag.title=note;cell.append(flag)}}))}
show(0);
annotateReviews();
</script>
</body>
